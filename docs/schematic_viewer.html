<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RISC-V RV32I 5-Stage Pipelined Processor — Architecture Schematic</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background: #1e293b;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #334155;
    }
    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #38bdf8;
    }
    header .subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: #0284c7;
      color: #fff;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-left: 10px;
    }
    .controls {
      display: flex;
      gap: 10px;
    }
    button {
      background: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #475569;
    }
    main {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f8fafc;
      padding: 20px;
    }
    .svg-container {
      width: 100%;
      max-width: 1500px;
      height: auto;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
      border-radius: 12px;
      overflow: hidden;
    }
    footer {
      background: #1e293b;
      padding: 8px 24px;
      font-size: 0.8rem;
      color: #64748b;
      text-align: center;
      border-top: 1px solid #334155;
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>RISC-V RV32I 5-Stage Pipelined Processor Architecture <span class="badge">Publication Ready</span></h1>
      <div class="subtitle">Author: Sumit Pandey | RRU ECE 2026 | Verified with Xilinx Vivado 2022.2 &amp; SVA Assertions</div>
    </div>
    <div class="controls">
      <button onclick="window.print()">Print / Export PDF</button>
      <button onclick="window.location.href='riscv_5stage_pipeline_schematic.svg'">Open Raw SVG</button>
    </div>
  </header>
  <main>
    <div class="svg-container">
      <img src="riscv_5stage_pipeline_schematic.svg" alt="RISC-V RV32I 5-Stage Pipeline Schematic" style="width:100%; height:auto; display:block;" />
    </div>
  </main>
  <footer>
    Interactive Hardware Architecture Viewer &bull; Rashtriya Raksha University (RRU) ECE 2026
  </footer>
</body>
</html>
